<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 120px;
    margin-top: 26px;
    --skin-color: #D37B5E;
  }
  #badge {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    border: 2px solid #1A1A1A;
    padding: 4px 10px;
    font-family: "Courier New", monospace;
    font-weight: 700;
    font-size: 11px;
    white-space: nowrap;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
    z-index: 2;
  }
  #badge-arrow {
    position: absolute;
    top: -4px;
    left: 50%;
    width: 10px;
    height: 10px;
    border-right: 2px solid #1A1A1A;
    border-bottom: 2px solid #1A1A1A;
    transform: translate(-50%, 0) rotate(45deg);
    z-index: 1;
  }
  svg { display: block; overflow: visible; }

  #tool-caption {
    color: #888;
    font-size: 10px;
    margin-top: 4px;
    height: 12px;
  }

  #anim-group { transform-box: fill-box; transform-origin: center; }
  .skin { fill: var(--skin-color); }

  @keyframes pxFloat { 0%,50% { transform: translateY(0); } 51%,100% { transform: translateY(-4px); } }
  @keyframes pxBob { 0%,50% { transform: translateY(0); } 51%,100% { transform: translateY(-7px); } }
  @keyframes pxLean { 0%,50% { transform: rotate(-3deg) translateY(0); } 51%,100% { transform: rotate(-3deg) translateY(2px); } }
  @keyframes pxShiver { 0%,33% { transform: translateX(-3px); } 34%,66% { transform: translateX(3px); } 67%,100% { transform: translateX(0); } }
  @keyframes pxTilt { 0%,50% { transform: rotate(8deg) translateY(0); } 51%,100% { transform: rotate(8deg) translateY(-3px); } }
  @keyframes pxSlump { 0%,50% { transform: translateY(6px); } 51%,100% { transform: translateY(9px); } }
  @keyframes pxBounce { 0%,20% { transform: translateY(0); } 40% { transform: translateY(-16px); } 60%,100% { transform: translateY(0); } }
  @keyframes pxBlink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0.2; } }
  @keyframes pxFade { 0%,100% { opacity: 0.9; } 50% { opacity: 0.15; } }
  @keyframes pxGrow { 0%,100% { transform: scaleX(0.3); } 50% { transform: scaleX(1); } }
  @keyframes pxTwinkle { 0%,50% { opacity: 1; } 51%,100% { opacity: 0.3; } }

  .pet-idle { animation: pxFloat 3s steps(1) infinite; }
  .pet-working { animation: pxBob 0.6s steps(1) infinite; }
  .pet-editing { animation: pxLean 1.4s steps(1) infinite; }
  .pet-testing { animation: pxShiver 0.3s steps(1) infinite; }
  .pet-waiting { animation: pxTilt 1.8s steps(1) infinite; }
  .pet-sad { animation: pxSlump 2.6s steps(1) infinite; }
  .pet-done { animation: pxBounce 1s steps(1) infinite; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="badge-arrow"></div>
    <div id="badge">REPOS</div>
    <svg viewBox="0 0 160 190" width="120" height="142">
      <defs>
        <filter id="outline" x="-50%" y="-50%" width="200%" height="200%">
          <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="5"></feMorphology>
          <feFlood flood-color="#FFFFFF" result="WHITE"></feFlood>
          <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"></feComposite>
          <feMerge>
            <feMergeNode in="OUTLINE"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      <g id="anim-group">
        <g filter="url(#outline)">

          <!-- body -->
          <g data-only="idle,working,waiting">
            <path d="M 30 40 H 130 V 90 H 145 V 115 H 130 V 150 H 110 V 120 H 95 V 150 H 65 V 120 H 50 V 150 H 30 V 115 H 15 V 90 H 30 Z" class="skin"></path>
          </g>
          <g data-only="sad">
            <path d="M 30 65 H 130 V 105 H 145 V 125 H 130 V 155 H 110 V 130 H 95 V 155 H 65 V 130 H 50 V 155 H 30 V 125 H 15 V 105 H 30 Z" class="skin"></path>
          </g>
          <g data-only="testing">
            <path d="M 32 45 H 132 V 95 H 147 V 120 H 132 V 155 H 112 V 125 H 97 V 155 H 67 V 125 H 52 V 155 H 32 V 120 H 17 V 95 H 32 Z" class="skin"></path>
          </g>
          <g data-only="editing">
            <path d="M 30 45 H 130 V 95 H 145 V 120 H 130 V 155 H 110 V 125 H 95 V 155 H 65 V 125 H 50 V 155 H 30 V 120 H 15 V 95 H 30 Z" class="skin"></path>
          </g>
          <g data-only="done">
            <rect x="25" y="20" width="8" height="8" fill="#FACC15" style="animation: pxTwinkle 0.6s steps(1) infinite;"></rect>
            <rect x="130" y="25" width="8" height="8" fill="#4ADE80" style="animation: pxTwinkle 0.6s steps(1) infinite 0.2s;"></rect>
            <rect x="80" y="15" width="8" height="8" fill="#38BDF8" style="animation: pxTwinkle 0.6s steps(1) infinite 0.4s;"></rect>
            <path d="M 30 40 H 130 V 90 H 145 V 115 H 130 V 160 H 110 V 125 H 95 V 160 H 65 V 125 H 50 V 160 H 30 V 115 H 15 V 90 H 30 Z" class="skin"></path>
          </g>

          <!-- eyes -->
          <g data-only="idle">
            <rect x="45" y="72" width="18" height="4" fill="#1A1A1A"></rect>
            <rect x="97" y="72" width="18" height="4" fill="#1A1A1A"></rect>
          </g>
          <g data-only="working">
            <rect x="45" y="65" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="97" y="65" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="53" y="69" width="6" height="6" fill="#FFFFFF"></rect>
            <rect x="105" y="69" width="6" height="6" fill="#FFFFFF"></rect>
          </g>
          <g data-only="editing">
            <rect x="38" y="65" width="32" height="24" fill="#1A1A1A"></rect>
            <rect x="90" y="65" width="32" height="24" fill="#1A1A1A"></rect>
            <rect x="70" y="72" width="20" height="6" fill="#1A1A1A"></rect>
            <rect x="44" y="71" width="20" height="12" fill="#FFFFFF"></rect>
            <rect x="96" y="71" width="20" height="12" fill="#FFFFFF"></rect>
            <rect x="52" y="74" width="8" height="8" fill="#1A1A1A"></rect>
            <rect x="104" y="74" width="8" height="8" fill="#1A1A1A"></rect>
          </g>
          <g data-only="testing">
            <path d="M 45 68 L 61 84 M 61 68 L 45 84" stroke="#1A1A1A" stroke-width="6"></path>
            <path d="M 99 68 L 115 84 M 115 68 L 99 84" stroke="#1A1A1A" stroke-width="6"></path>
            <rect x="135" y="60" width="8" height="8" fill="#38BDF8"></rect>
            <rect x="139" y="70" width="8" height="8" fill="#38BDF8"></rect>
            <rect x="18" y="75" width="8" height="8" fill="#38BDF8"></rect>
          </g>
          <g data-only="waiting">
            <rect x="45" y="66" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="97" y="56" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="53" y="70" width="6" height="6" fill="#FFFFFF"></rect>
            <rect x="105" y="60" width="6" height="6" fill="#FFFFFF"></rect>
          </g>
          <g data-only="sad">
            <path d="M 45 80 L 55 92 L 65 80 L 61 80 L 55 87 L 49 80 Z" fill="#1A1A1A"></path>
            <path d="M 95 80 L 105 92 L 115 80 L 111 80 L 105 87 L 99 80 Z" fill="#1A1A1A"></path>
            <rect x="118" y="45" width="20" height="20" fill="#EF4444"></rect>
            <text x="128" y="60" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">&#215;</text>
          </g>
          <g data-only="done">
            <path d="M 45 68 L 63 78 L 45 88 L 45 80 L 53 78 L 45 76 Z" fill="#1A1A1A"></path>
            <path d="M 115 68 L 97 78 L 115 88 L 115 80 L 107 78 L 115 76 Z" fill="#1A1A1A"></path>
          </g>

          <!-- screen -->
          <rect x="40" y="115" width="80" height="30" fill="#1A1A1A"></rect>
          <rect id="screen-inner" x="45" y="120" width="70" height="20" fill="#2E2E2E"></rect>

          <g data-only="idle">
            <rect x="55" y="124" width="5" height="5" fill="#1A1A1A" style="animation: pxFade 1.6s steps(1) infinite;"></rect>
            <rect x="65" y="119" width="4" height="4" fill="#1A1A1A" style="animation: pxFade 1.6s steps(1) infinite 0.3s;"></rect>
            <rect x="73" y="115" width="3" height="3" fill="#1A1A1A" style="animation: pxFade 1.6s steps(1) infinite 0.6s;"></rect>
          </g>
          <g data-only="working">
            <rect x="50" y="125" width="25" height="3" fill="#1A1A1A"></rect>
            <rect x="50" y="131" width="40" height="3" fill="#1A1A1A"></rect>
            <rect x="50" y="137" width="15" height="3" fill="#1A1A1A" style="animation: pxBlink 0.5s steps(1) infinite;"></rect>
          </g>
          <g data-only="editing">
            <rect x="50" y="126" width="45" height="4" fill="#1A1A1A" style="animation: pxGrow 1.2s steps(1) infinite; transform-origin: 50px 128px;"></rect>
            <rect x="100" y="122" width="6" height="6" fill="#1A1A1A"></rect>
            <rect x="98" y="128" width="10" height="3" fill="#1A1A1A"></rect>
          </g>
          <g data-only="testing">
            <rect x="48" y="128" width="64" height="8" fill="none" stroke="#1A1A1A" stroke-width="2"></rect>
            <rect x="50" y="130" width="40" height="4" fill="#1A1A1A" style="animation: pxGrow 0.8s steps(1) infinite; transform-origin: 50px 132px;"></rect>
          </g>
          <g data-only="waiting">
            <rect x="70" y="122" width="6" height="12" fill="#1A1A1A" style="animation: pxBlink 0.9s steps(1) infinite;"></rect>
            <rect x="84" y="122" width="6" height="12" fill="#1A1A1A" style="animation: pxBlink 0.9s steps(1) infinite 0.2s;"></rect>
          </g>
          <g data-only="sad">
            <rect x="52" y="122" width="6" height="6" fill="#1A1A1A"></rect>
            <rect x="60" y="128" width="6" height="6" fill="#1A1A1A"></rect>
            <rect x="60" y="122" width="6" height="6" fill="#1A1A1A"></rect>
            <rect x="52" y="128" width="6" height="6" fill="#1A1A1A"></rect>
          </g>
          <g data-only="done">
            <rect x="58" y="130" width="5" height="5" fill="#1A1A1A"></rect>
            <rect x="63" y="135" width="5" height="5" fill="#1A1A1A"></rect>
            <rect x="68" y="130" width="5" height="5" fill="#1A1A1A"></rect>
            <rect x="73" y="125" width="5" height="5" fill="#1A1A1A"></rect>
            <rect x="78" y="120" width="5" height="5" fill="#1A1A1A"></rect>
          </g>

          <g data-only="waiting">
            <rect x="112" y="35" width="10" height="10" fill="#3B82F6" style="animation: pxTwinkle 1s steps(1) infinite;"></rect>
          </g>

        </g>
      </g>
    </svg>
  </div>
  <div id="tool-caption"></div>
</div>

<script>
  const STATES = {
    idle:    { label: "REPOS",   color: "#A3A3A3", badgeText: "#1A1A1A", screenBg: "#2E2E2E", anim: "pet-idle" },
    working: { label: "OCCUPÉ",  color: "#38BDF8", badgeText: "#1A1A1A", screenBg: "#38BDF8", anim: "pet-working" },
    editing: { label: "EDITING", color: "#F97316", badgeText: "#FFFFFF", screenBg: "#FDE4CB", anim: "pet-editing" },
    testing: { label: "TESTING", color: "#EF4444", badgeText: "#FFFFFF", screenBg: "#FCD9D9", anim: "pet-testing" },
    waiting: { label: "ATTENTE", color: "#3B82F6", badgeText: "#FFFFFF", screenBg: "#DCEAFE", anim: "pet-waiting" },
    sad:     { label: "ERREUR",  color: "#64748B", badgeText: "#FFFFFF", screenBg: "#FBDADA", anim: "pet-sad" },
    done:    { label: "DONE !",  color: "#22C55E", badgeText: "#FFFFFF", screenBg: "#D7F7DC", anim: "pet-done" },
  };

  const animGroup = document.getElementById("anim-group");
  const badge = document.getElementById("badge");
  const badgeArrow = document.getElementById("badge-arrow");
  const screenInner = document.getElementById("screen-inner");
  const toolCaption = document.getElementById("tool-caption");
  const onlyEls = document.querySelectorAll("[data-only]");

  let currentState = null;

  function setState(state, tool) {
    const key = STATES[state] ? state : "idle";
    const s = STATES[key];

    if (key !== currentState) {
      if (currentState) animGroup.classList.remove(STATES[currentState].anim);
      animGroup.classList.add(s.anim);
      currentState = key;

      onlyEls.forEach((el) => {
        const list = el.dataset.only.split(",");
        el.style.display = list.includes(key) ? "" : "none";
      });

      badge.textContent = s.label;
      badge.style.background = s.color;
      badge.style.color = s.badgeText;
      badgeArrow.style.background = s.color;
      screenInner.setAttribute("fill", s.screenBg);
    }

    toolCaption.textContent = tool || "";
  }

  const stage = document.getElementById("stage");

  function setSkin(hexColor) {
    if (hexColor) stage.style.setProperty("--skin-color", hexColor);
  }

  window.setPetState = setState;
  window.setPetSkin = setSkin;
  setState("idle", "");

  window.addEventListener("pywebviewready", () => {
    document.body.addEventListener("click", () => {
      window.pywebview.api.focus_terminal();
    });
  });
</script>
</body>
</html>
