<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Pet</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 120px;
    margin-top: 26px;
    transform-origin: center;
    --skin-color: #D37B5E;
  }
  /* The badge centers itself over the pet exactly like before the settings
     button existed — #controls/#extra-controls are absolutely positioned
     off of it, so they never add to its box and never shift its center. */
  #badge {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 2px solid #1A1A1A;
    padding: 4px 10px;
    font-family: "Courier New", monospace;
    font-weight: 700;
    font-size: 11px;
    white-space: nowrap;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
    z-index: 2;
  }
  /* Stretches to the badge's own height (top/bottom against the badge's
     box), so the gear button always matches the badge's height regardless
     of how tall the badge itself renders. The -2px top/bottom offsets pull
     it out past the badge's own 2px border, since top:0/bottom:0 alone only
     reaches the inside edge of that border (the padding box), not the
     visible outer edge. */
  #controls {
    position: absolute;
    top: -2px;
    bottom: -2px;
    left: 100%;
    margin-left: 6px;
  }
  #btn-gear {
    height: 100%;
    width: 20px;
  }
  /* Opens above the badge as a horizontal row overlay, right-anchored to the
     gear button (its own trigger) instead of centered over the whole badge —
     it never pushes the badge, the gear, or the window size around, open or
     closed. */
  #extra-controls {
    display: none;
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 4px;
    flex-direction: row;
    gap: 3px;
  }
  #extra-controls.expanded {
    display: flex;
  }
  #btn-hide, #btn-shrink, #btn-grow {
    height: 20px;
  }
  #btn-gear, #btn-hide {
    font-size: 15px;
  }
  .resize-btn {
    width: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #1A1A1A;
    background: #FFFFFF;
    color: #1A1A1A;
    font-family: "Courier New", monospace;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.15);
  }
  #skin-dot {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--skin-color);
    border: 1px solid rgba(0, 0, 0, 0.3);
    flex: none;
  }
  /* Only needed to tell pets apart once the character (which normally
     carries the skin color) is hidden. */
  #wrap.hidden-mode #skin-dot {
    display: block;
  }
  #badge-arrow {
    position: absolute;
    top: -4px;
    left: 50%;
    width: 10px;
    height: 10px;
    border-right: 2px solid #1A1A1A;
    border-bottom: 2px solid #1A1A1A;
    transform: translate(-50%, 0) rotate(45deg);
    z-index: 1;
  }
  svg { display: block; overflow: visible; }

  #anim-group { transform-box: fill-box; transform-origin: center; }
  .skin { fill: var(--skin-color); }

  /* Feature 3: hide the character, keep just the state badge (+ skin dot) */
  #wrap.hidden-mode svg,
  #wrap.hidden-mode #badge-arrow {
    display: none;
  }
  #wrap.hidden-mode #stage {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 0;
    /* #stage's 120px width fits just the badge fine, but badge+gear (which
       only joins the row in hidden mode) is wider and would get squeezed to
       fit that 120px otherwise. */
    width: auto;
  }
  /* position:relative (not static): #controls/#extra-controls are
     positioned off of #badge (so they never affect the badge's own
     centering above the pet in normal mode) — #badge must stay a
     containing block for that even while flowing normally here. The
     margin-right reserves the same room #controls occupies (its absolute
     overlay doesn't take up any actual layout space on its own), so the
     badge+gear pair as a visual whole ends up centered by #stage instead of
     just the badge itself with the gear hanging off one side of center. */
  #wrap.hidden-mode #badge {
    position: relative;
    top: 0;
    left: auto;
    transform: none;
    margin-right: 32px;
  }

  @keyframes pxFloat { 0%,50% { transform: translateY(0); } 51%,100% { transform: translateY(-4px); } }
  @keyframes pxLean { 0%,50% { transform: rotate(-3deg) translateY(0); } 51%,100% { transform: rotate(-3deg) translateY(2px); } }
  @keyframes pxTilt { 0%,50% { transform: rotate(8deg) translateY(0); } 51%,100% { transform: rotate(8deg) translateY(-3px); } }
  @keyframes pxSlump { 0%,50% { transform: translateY(6px); } 51%,100% { transform: translateY(9px); } }
  @keyframes pxBounce { 0%,20% { transform: translateY(0); } 40% { transform: translateY(-16px); } 60%,100% { transform: translateY(0); } }
  @keyframes pxTwinkle { 0%,50% { opacity: 1; } 51%,100% { opacity: 0.3; } }

  .pet-idle { animation: pxFloat 3s steps(1) infinite; }
  .pet-editing { animation: pxLean 1.4s steps(1) infinite; }
  .pet-waiting { animation: pxTilt 1.8s steps(1) infinite; }
  .pet-sad { animation: pxSlump 2.6s steps(1) infinite; }
  .pet-done { animation: pxBounce 1s steps(1) infinite; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="badge-arrow"></div>
    <div id="badge">
      <span id="skin-dot"></span>
      <span id="badge-label">IDLE</span>
      <div id="controls">
        <button class="resize-btn" id="btn-gear" type="button">&#9881;</button>
        <div id="extra-controls">
          <button class="resize-btn" id="btn-hide" type="button">&#8857;</button>
          <button class="resize-btn" id="btn-shrink" type="button">&minus;</button>
          <button class="resize-btn" id="btn-grow" type="button">+</button>
        </div>
      </div>
    </div>
    <svg viewBox="0 0 160 190" width="120" height="142">
      <defs>
        <filter id="outline" x="-50%" y="-50%" width="200%" height="200%">
          <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="5"></feMorphology>
          <feFlood flood-color="#FFFFFF" result="WHITE"></feFlood>
          <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"></feComposite>
          <feMerge>
            <feMergeNode in="OUTLINE"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      <g id="anim-group">
        <g filter="url(#outline)">

          <!-- body -->
          <g data-only="idle,waiting">
            <path d="M 30 40 H 130 V 90 H 145 V 115 H 130 V 150 H 110 V 120 H 95 V 150 H 65 V 120 H 50 V 150 H 30 V 115 H 15 V 90 H 30 Z" class="skin"></path>
          </g>
          <g data-only="sad">
            <path d="M 30 65 H 130 V 105 H 145 V 125 H 130 V 155 H 110 V 130 H 95 V 155 H 65 V 130 H 50 V 155 H 30 V 125 H 15 V 105 H 30 Z" class="skin"></path>
          </g>
          <g data-only="editing">
            <path d="M 30 45 H 130 V 95 H 145 V 120 H 130 V 155 H 110 V 125 H 95 V 155 H 65 V 125 H 50 V 155 H 30 V 120 H 15 V 95 H 30 Z" class="skin"></path>
          </g>
          <g data-only="done">
            <rect x="25" y="20" width="8" height="8" fill="#FACC15" style="animation: pxTwinkle 0.6s steps(1) infinite;"></rect>
            <rect x="130" y="25" width="8" height="8" fill="#4ADE80" style="animation: pxTwinkle 0.6s steps(1) infinite 0.2s;"></rect>
            <rect x="80" y="15" width="8" height="8" fill="#38BDF8" style="animation: pxTwinkle 0.6s steps(1) infinite 0.4s;"></rect>
            <path d="M 30 40 H 130 V 90 H 145 V 115 H 130 V 160 H 110 V 125 H 95 V 160 H 65 V 125 H 50 V 160 H 30 V 115 H 15 V 90 H 30 Z" class="skin"></path>
          </g>

          <!-- eyes -->
          <g data-only="idle">
            <rect x="45" y="72" width="18" height="4" fill="#1A1A1A"></rect>
            <rect x="97" y="72" width="18" height="4" fill="#1A1A1A"></rect>
          </g>
          <g data-only="editing">
            <rect x="38" y="65" width="32" height="24" fill="#1A1A1A"></rect>
            <rect x="90" y="65" width="32" height="24" fill="#1A1A1A"></rect>
            <rect x="70" y="72" width="20" height="6" fill="#1A1A1A"></rect>
            <rect x="44" y="71" width="20" height="12" fill="#FFFFFF"></rect>
            <rect x="96" y="71" width="20" height="12" fill="#FFFFFF"></rect>
            <rect x="52" y="74" width="8" height="8" fill="#1A1A1A"></rect>
            <rect x="104" y="74" width="8" height="8" fill="#1A1A1A"></rect>
          </g>
          <g data-only="waiting">
            <rect x="45" y="66" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="97" y="56" width="18" height="18" fill="#1A1A1A"></rect>
            <rect x="53" y="70" width="6" height="6" fill="#FFFFFF"></rect>
            <rect x="105" y="60" width="6" height="6" fill="#FFFFFF"></rect>
          </g>
          <g data-only="sad">
            <path d="M 45 68 L 61 84 M 61 68 L 45 84" stroke="#1A1A1A" stroke-width="6"></path>
            <path d="M 99 68 L 115 84 M 115 68 L 99 84" stroke="#1A1A1A" stroke-width="6"></path>
          </g>
          <g data-only="done">
            <path d="M 45 68 L 63 78 L 45 88 L 45 80 L 53 78 L 45 76 Z" fill="#1A1A1A"></path>
            <path d="M 115 68 L 97 78 L 115 88 L 115 80 L 107 78 L 115 76 Z" fill="#1A1A1A"></path>
          </g>

          <g data-only="waiting">
            <rect x="112" y="35" width="10" height="10" fill="#3B82F6" style="animation: pxTwinkle 1s steps(1) infinite;"></rect>
          </g>

        </g>
      </g>
    </svg>
  </div>
</div>

<script>
  const STATES = {
    idle:    { label: "IDLE",    color: "#A3A3A3", badgeText: "#1A1A1A", anim: "pet-idle" },
    editing: { label: "WORKING", color: "#F97316", badgeText: "#FFFFFF", anim: "pet-editing" },
    waiting: { label: "WAITING", color: "#3B82F6", badgeText: "#FFFFFF", anim: "pet-waiting" },
    sad:     { label: "ERROR",   color: "#64748B", badgeText: "#FFFFFF", anim: "pet-sad" },
    done:    { label: "DONE !",  color: "#22C55E", badgeText: "#FFFFFF", anim: "pet-done" },
  };

  const animGroup = document.getElementById("anim-group");
  const wrap = document.getElementById("wrap");
  const badge = document.getElementById("badge");
  const badgeLabel = document.getElementById("badge-label");
  const badgeArrow = document.getElementById("badge-arrow");
  const onlyEls = document.querySelectorAll("[data-only]");

  let currentState = null;

  function setState(state) {
    const key = STATES[state] ? state : "idle";
    const s = STATES[key];

    if (key !== currentState) {
      if (currentState) animGroup.classList.remove(STATES[currentState].anim);
      animGroup.classList.add(s.anim);
      currentState = key;

      onlyEls.forEach((el) => {
        const list = el.dataset.only.split(",");
        el.style.display = list.includes(key) ? "" : "none";
      });

      badgeLabel.textContent = s.label;
      badge.style.background = s.color;
      badge.style.color = s.badgeText;
      badgeArrow.style.background = s.color;
    }
  }

  const stage = document.getElementById("stage");

  function setSkin(hexColor) {
    if (hexColor) stage.style.setProperty("--skin-color", hexColor);
  }

  function setScale(scale) {
    if (scale) stage.style.transform = `scale(${scale})`;
  }

  let isHidden = false;
  function setHidden(hidden) {
    isHidden = !!hidden;
    wrap.classList.toggle("hidden-mode", isHidden);
  }

  window.setPetState = setState;
  window.setPetSkin = setSkin;
  window.setPetScale = setScale;
  window.setPetHidden = setHidden;
  setState("idle", "");

  window.addEventListener("pywebviewready", () => {
    const extraControls = document.getElementById("extra-controls");
    document.getElementById("btn-gear").addEventListener("click", (e) => {
      e.stopPropagation();
      extraControls.classList.toggle("expanded");
      // The click-through pass-through mask (feature 1) is only refreshed
      // on Python-driven state/scale/hide changes — this popup is a purely
      // client-side class toggle, so without this the mask stays stale and
      // reads the just-revealed buttons as transparent, letting clicks on
      // them pass straight through instead of registering.
      window.pywebview.api.request_snapshot();
    });
    document.getElementById("btn-hide").addEventListener("click", (e) => {
      e.stopPropagation();
      window.pywebview.api.set_pet_hidden(!isHidden);
    });
    document.getElementById("btn-shrink").addEventListener("click", (e) => {
      e.stopPropagation();
      window.pywebview.api.resize_pet(-1);
    });
    document.getElementById("btn-grow").addEventListener("click", (e) => {
      e.stopPropagation();
      window.pywebview.api.resize_pet(1);
    });

    let downX = 0, downY = 0;
    document.body.addEventListener("mousedown", (e) => {
      // screenX/Y (absolute desktop position), not clientX/Y: easy_drag moves
      // the window along with the cursor, so clientX/Y (relative to the
      // viewport) barely changes during a drag — the viewport is dragging
      // right along with the pointer that's supposedly moving across it.
      downX = e.screenX;
      downY = e.screenY;
    });
    document.body.addEventListener("click", (e) => {
      // Only treat this as a real click (and steal focus back to the
      // terminal) if the pointer barely moved between mousedown and mouseup —
      // otherwise this was a window drag, not a click.
      if (Math.hypot(e.screenX - downX, e.screenY - downY) < 4) {
        window.pywebview.api.focus_terminal();
      }
    });
  });
</script>
</body>
</html>
